<!DOCTYPE html>
<!-- CAROUSEL SABLONU (1080x1350). Ilk kart = gunun postu (ayri cizilir).
     body.s-detay : urun fotografi + kisa fayda cumlesi + sayac
     body.s-son   : fiyat + 3 madde + showroom/DM cagrisi
     Renk ve fontlar Sanat Yonetmeni'nin gunluk tarifinden gelir (kapakla ayni gorunum). -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="{{fontlar}}"><link rel="stylesheet" href="{{ortak}}">
<style>
:root { --w:1080px; --h:1350px; --zemin:{{t_zemin}}; --yazi:{{t_yazi}}; --vurgu:{{t_vurgu}}; --vurgu-yazi:{{t_vurgu_yazi}};
  --panel:{{t_panel}}; --panel-yazi:{{t_panel_yazi}}; }
.f-klasik    { --bf:"Cormorant Garamond",Georgia,"DejaVu Serif",serif; --gf:"Montserrat","Segoe UI","DejaVu Sans",sans-serif; --bw:600; --bt:none; --bls:0; --bo:1; }
.f-modern    { --bf:"Playfair Display",Georgia,"DejaVu Serif",serif; --gf:"Inter","Segoe UI","DejaVu Sans",sans-serif; --bw:700; --bt:none; --bls:-.01em; --bo:1; }
.f-cesur     { --bf:"Bebas Neue",Impact,"Arial Narrow","DejaVu Sans Condensed",sans-serif; --gf:"Montserrat","Segoe UI","DejaVu Sans",sans-serif; --bw:400; --bt:uppercase; --bls:.02em; --bo:1.25; }
.f-zarif     { --bf:"Marcellus","Trajan Pro",Georgia,"DejaVu Serif",serif; --gf:"Jost","Segoe UI","DejaVu Sans",sans-serif; --bw:400; --bt:uppercase; --bls:.06em; --bo:.82; }
.f-editoryal { --bf:"DM Serif Display",Georgia,"DejaVu Serif",serif; --gf:"DM Sans","Segoe UI","DejaVu Sans",sans-serif; --bw:400; --bt:none; --bls:-.01em; --bo:1.05; }
body { font-family: var(--gf, "Montserrat","Segoe UI","DejaVu Sans",sans-serif); }
.e-sicak { --filtre: brightness(1.03); } .e-dramatik { --filtre: contrast(1.05); }
.kare { background: var(--zemin); color: var(--yazi); }
.sayac { position:absolute; top:58px; right:60px; z-index:8; font-weight:700; font-size:20px; letter-spacing:.18em;
  padding:10px 20px; border-radius:40px; background:rgba(0,0,0,.42); color:#fff; backdrop-filter: blur(6px); }
.noktalar { position:absolute; left:0; right:0; bottom:44px; z-index:8; display:flex; justify-content:center; gap:12px; }
.noktalar i { width:11px; height:11px; border-radius:50%; background:currentColor; opacity:.35; }
.noktalar i.aktif { opacity:1; width:34px; border-radius:6px; }
.logo { position:absolute; z-index:8; height:84px; filter:drop-shadow(0 2px 8px rgba(0,0,0,.35)); }

/* ---------------- DETAY KARTI ---------------- */
.s-detay .foto-kutu { position:absolute; inset:0; overflow:hidden; }
.s-detay .foto-kutu img { width:100%; height:100%; object-fit:cover; display:block; filter:var(--filtre, none); }
.s-detay .karart { position:absolute; inset:0; z-index:2;
  background:linear-gradient(180deg, rgba(0,0,0,.40) 0%, rgba(0,0,0,0) 20%, rgba(0,0,0,0) 52%, rgba(0,0,0,.80) 100%); }
.s-detay .logo { top:48px; left:56px; }
.s-detay .metin { position:absolute; z-index:4; left:72px; right:72px; bottom:118px; color:#fff; }
.s-detay .kat { font-weight:600; letter-spacing:.3em; text-transform:uppercase; font-size:18px; color:var(--vurgu-acik, #E6CC8A); margin-bottom:18px;
  display:flex; align-items:center; gap:16px; }
.s-detay .kat::before { content:""; width:56px; height:2px; background:currentColor; }
.s-detay .detay { font-family:var(--bf); font-weight:var(--bw); text-transform:var(--bt); letter-spacing:var(--bls);
  font-size:calc(64px * var(--bo)); line-height:1.08; max-width:900px; text-shadow:0 2px 18px rgba(0,0,0,.35); }
.s-detay .noktalar { color:#fff; }
.s-detay .alt-ad { margin-top:20px; font-size:20px; letter-spacing:.2em; text-transform:uppercase; opacity:.8; font-weight:600; }

/* ---------------- SON KART ---------------- */
.s-son .kare { background:var(--panel); color:var(--panel-yazi); }
.s-son .foto-kutu { position:absolute; top:150px; left:90px; right:90px; height:560px; border-radius:6px; overflow:hidden;
  box-shadow:0 30px 60px rgba(0,0,0,.28); outline:1px solid var(--vurgu); outline-offset:12px; }
.s-son .foto-kutu img { width:100%; height:100%; object-fit:cover; display:block; filter:var(--filtre, none); }
.s-son .logo { top:36px; left:50%; transform:translateX(-50%); height:88px; filter:none; }
.s-son .sayac { background:rgba(0,0,0,.18); color:var(--panel-yazi); }
.s-son .metin { position:absolute; left:90px; right:90px; top:760px; text-align:center; }
.s-son .ad { font-family:var(--bf); font-weight:var(--bw); text-transform:var(--bt); letter-spacing:var(--bls);
  font-size:calc(66px * var(--bo)); line-height:1.02; }
.s-son .fiyat { display:flex; justify-content:center; align-items:baseline; gap:24px; margin-top:18px; }
.s-son .eski { font-size:30px; opacity:.6; }
.s-son .yeni { font-size:62px; font-weight:800; color:var(--vurgu); }
.s-son .rozet { display:inline-block; margin-left:6px; background:var(--vurgu); color:var(--vurgu-yazi); font-weight:800;
  font-size:24px; letter-spacing:.08em; padding:8px 16px; border-radius:30px; vertical-align:middle; }
.s-son .maddeler { list-style:none; margin:30px auto 0; display:inline-block; text-align:left; font-size:27px; line-height:1.55; }
.s-son .maddeler li { display:flex; gap:16px; align-items:baseline; }
.s-son .maddeler li::before { content:""; flex:0 0 12px; height:12px; border-radius:50%; background:var(--vurgu); transform:translateY(-3px); }
.s-son .cta { position:absolute; left:90px; right:90px; bottom:96px; text-align:center; }
.s-son .cta b { display:inline-block; background:var(--vurgu); color:var(--vurgu-yazi); font-size:24px; font-weight:700;
  letter-spacing:.14em; text-transform:uppercase; padding:20px 38px; border-radius:60px; }
.s-son .cta span { display:block; margin-top:14px; font-size:18px; letter-spacing:.24em; text-transform:uppercase; opacity:.7; font-weight:600; }
.s-son .noktalar { color:var(--panel-yazi); bottom:40px; }
.kisa .maddeler { font-size:24px; }
</style></head>
<body class="{{siniflar}} {{kart_tipi}}">
<div class="kare">
  <div class="foto-kutu"><img src="{{foto1}}"></div>
  <div class="karart"></div>
  <img class="logo" src="{{logo_kart}}">
  <div class="sayac">{{sayac}}</div>

  <div class="metin">
    <div class="detay-blok">
      <div class="kat">{{kategori}}</div>
      <div class="detay">{{detay}}</div>
      <div class="alt-ad">{{ad}}</div>
    </div>
    <div class="son-blok">
      <div class="ad">{{ad}}</div>
      <div class="fiyat"><span class="eski ustu-cizili {{eski_gizle}}">{{eski_fiyat}}</span><span class="yeni">{{fiyat}}</span>
        <span class="rozet {{rozet_gizle}}">-{{indirim}}%</span></div>
      <ul class="maddeler"><li>{{madde1}}</li><li>{{madde2}}</li><li class="{{madde3_gizle}}">{{madde3}}</li></ul>
    </div>
  </div>
  <div class="cta"><b>{{cta}}</b><span>{{web}}</span></div>
  <div class="noktalar">{{t_noktalar}}</div>
</div>
<style>
.s-detay .son-blok, .s-detay .cta { display:none; }
.s-son .detay-blok, .s-son .karart { display:none; }
</style>
</body></html>
