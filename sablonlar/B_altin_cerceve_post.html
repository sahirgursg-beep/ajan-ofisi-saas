<!DOCTYPE html>
<!-- B · ALTIN CERCEVE: logodaki cift altin cerceveden esinli, koyu espresso zemin, galeri hissi. Post + story. -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="{{fontlar}}"><link rel="stylesheet" href="{{ortak}}">
<style>
  :root { --w: 1080px; --h: 1350px; --foto-oran: 1.42; }
  body.story { --foto-oran: .9; }
  .kare { background: radial-gradient(ellipse at 50% 30%, #3a2c23 0%, var(--kahve) 45%, var(--koyu) 100%); }
  .doku { position: absolute; inset: 0; opacity: .06;
    background-image: repeating-linear-gradient(115deg, #fff 0 1px, transparent 1px 7px); }
  .c1 { position: absolute; inset: 26px; border: 2px solid var(--altin); }
  .c2 { position: absolute; inset: 40px; border: 1px solid rgba(201,162,75,.55); }
  .icerik { position: absolute; inset: 72px 86px 66px; display: flex; flex-direction: column;
    align-items: center; justify-content: space-between; }
  .logo { height: 78px; }
  body.story .logo { height: 104px; }
  .cerceve { width: 100%; aspect-ratio: var(--foto-oran); padding: 12px; border: 1px solid var(--altin);
    background: rgba(0,0,0,.25); box-shadow: 0 30px 60px rgba(0,0,0,.45); }
  .cerceve img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .bilgi { text-align: center; width: 100%; }
  .kanca { font-family: var(--serif); font-style: italic; color: var(--altin-acik); font-size: 46px;
    margin-bottom: 26px; display: none; }
  body.story .kanca { display: block; }
  .kat { color: var(--altin); font-size: 18px; margin-bottom: 18px; }
  .ad { font-family: var(--serif); font-weight: 600; color: var(--krem); font-size: 78px; line-height: 1.02; }
  .ayrac { display: flex; align-items: center; justify-content: center; gap: 16px; margin: 26px 0 22px; }
  .ayrac i { width: 70px; height: 1px; background: var(--altin); }
  .ayrac b { width: 8px; height: 8px; background: var(--altin); transform: rotate(45deg); }
  .fiyat { display: flex; align-items: baseline; justify-content: center; gap: 26px; }
  .eski { color: rgba(244,239,230,.55); font-size: 30px; font-weight: 500; }
  .yeni { color: var(--altin-acik); font-size: 60px; font-weight: 600; }
  .cta { color: rgba(244,239,230,.7); font-size: 16px; text-align: center; }
</style></head>
<body><div class="kare">
  <div class="doku"></div><div class="c1"></div><div class="c2"></div>
  <div class="icerik">
    <img class="logo" src="{{logo_altin}}">
    <div class="cerceve"><img src="{{foto1}}"></div>
    <div class="bilgi">
      <div class="kanca">{{kanca}}</div>
      <div class="kat etiket">{{kategori}}</div>
      <div class="ad">{{ad}}</div>
      <div class="ayrac"><i></i><b></b><i></i></div>
      <div class="fiyat">
        <span class="eski ustu-cizili {{eski_gizle}}">{{eski_fiyat}}</span>
        <span class="yeni">{{fiyat}}</span>
      </div>
    </div>
    <div class="cta etiket">{{cta}}</div>
  </div>
</div></body></html>
