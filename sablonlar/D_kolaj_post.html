<!DOCTYPE html>
<!-- D · KOLAJ: bir buyuk + iki kucuk fotograf. Urunun farkli acilarini/detaylarini gosterir. En az 3 fotograf ister. -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="{{fontlar}}"><link rel="stylesheet" href="{{ortak}}">
<style>
  :root { --w: 1080px; --h: 1350px; --buyuk: 640px; --kucuk: 300px; }
  body.story { --buyuk: 860px; --kucuk: 420px; }
  .kare { background: var(--krem); padding: 40px; display: flex; flex-direction: column; gap: 14px; }
  body.story .kare { padding-top: 150px; }
  .buyuk { height: var(--buyuk); position: relative; overflow: hidden; border-radius: 4px; }
  .sira { display: flex; gap: 14px; height: var(--kucuk); }
  .sira div { flex: 1; overflow: hidden; border-radius: 4px; }
  img.f { width: 100%; height: 100%; object-fit: cover; display: block; }
  .logo-ust { position: absolute; top: 46px; left: 50%; transform: translateX(-50%); height: 66px; display: none; }
  body.story .logo-ust { display: block; }
  .rozet { position: absolute; top: 24px; right: 24px; background: var(--koyu); color: var(--altin-acik);
    padding: 14px 22px; font-weight: 700; font-size: 30px; letter-spacing: .04em; }
  .alt { flex: 1; display: flex; align-items: center; justify-content: space-between; gap: 30px; padding: 6px 10px 0; }
  .kat { color: var(--altin); font-size: 16px; margin-bottom: 10px; }
  .ad { font-family: var(--serif); font-weight: 600; color: var(--koyu); font-size: 58px; line-height: 1; }
  body.story .ad { font-size: 72px; }
  .sag { text-align: right; flex-shrink: 0; }
  .eski { color: #8a7f74; font-size: 26px; font-weight: 500; }
  .yeni { display: block; color: var(--koyu); font-size: 50px; font-weight: 700; margin-top: 4px; }
  .logo { height: 54px; margin-top: 12px; }
  body.story .logo { display: none; }
</style></head>
<body><div class="kare">
  <img class="logo-ust" src="{{logo_altin}}">
  <div class="buyuk"><img class="f" src="{{foto1}}">
    <div class="rozet {{rozet_gizle}}">-{{indirim}}%</div></div>
  <div class="sira"><div><img class="f" src="{{foto2}}"></div><div><img class="f" src="{{foto3}}"></div></div>
  <div class="alt">
    <div><div class="kat etiket">{{kategori}}</div><div class="ad">{{ad}}</div></div>
    <div class="sag">
      <span class="eski ustu-cizili {{eski_gizle}}">{{eski_fiyat}}</span>
      <span class="yeni">{{fiyat}}</span>
      <img class="logo" src="{{logo_altin}}">
    </div>
  </div>
</div></body></html>
