<!DOCTYPE html>
<!-- C · SHOWROOM FIRSATI: fotograf ustte, krem panelde indirim ve fiyat net. Satis odakli. Post + story. -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="{{fontlar}}"><link rel="stylesheet" href="{{ortak}}">
<style>
  :root { --w: 1080px; --h: 1350px; --ust: 900px; }
  body.story { --ust: 1300px; }
  .kare { background: var(--krem); }
  .ust { position: absolute; top: 0; left: 0; right: 0; height: var(--ust); }
  .ust::after { content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(20,15,12,.45) 0%, rgba(20,15,12,0) 22%); }
  .logo { position: absolute; top: 46px; left: 56px; height: 64px; z-index: 2;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,.45)); }
  body.story .logo { top: 110px; left: 50%; transform: translateX(-50%); height: 96px; }
  .rozet { position: absolute; top: calc(var(--ust) - 110px); right: 70px; width: 210px; height: 210px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #e8cf8f, var(--altin) 55%, #a8812f);
    box-shadow: 0 18px 40px rgba(0,0,0,.35), inset 0 0 0 6px rgba(255,255,255,.25);
    display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--koyu); z-index: 3; }
  .rozet .y { font-size: 70px; font-weight: 700; line-height: 1; letter-spacing: -.02em; }
  .rozet .o { font-size: 18px; font-weight: 700; letter-spacing: .3em; margin-top: 6px; }
  .panel { position: absolute; top: var(--ust); left: 0; right: 0; bottom: 70px; padding: 50px 70px 0; }
  body.story .panel { padding-top: 80px; }
  .kat { color: var(--altin); font-size: 17px; margin-bottom: 14px; }
  .ad { font-family: var(--serif); font-weight: 600; color: var(--koyu); font-size: 70px; line-height: 1.02; max-width: 700px; }
  body.story .ad { font-size: 84px; }
  .fiyat { display: flex; align-items: baseline; gap: 22px; margin-top: 26px; }
  .eski { color: #8a7f74; font-size: 30px; font-weight: 500; }
  .yeni { color: var(--koyu); font-size: 58px; font-weight: 700; }
  body.story .yeni { font-size: 72px; }
  .cta { position: absolute; left: 70px; right: 70px; bottom: 0; height: 70px;
    border-top: 1px solid rgba(28,22,18,.15); display: flex; align-items: center; justify-content: space-between;
    color: var(--kahve); font-size: 15px; }
  body.story .cta { bottom: 60px; }
</style></head>
<body><div class="kare">
  <div class="ust"><img class="foto" src="{{foto1}}"></div>
  <img class="logo" src="{{logo_altin}}">
  <div class="rozet {{rozet_gizle}}"><div class="y">-{{indirim}}%</div><div class="o">OFF</div></div>
  <div class="panel">
    <div class="kat etiket">{{kategori}}</div>
    <div class="ad">{{ad}}</div>
    <div class="fiyat">
      <span class="eski ustu-cizili {{eski_gizle}}">{{eski_fiyat}}</span>
      <span class="yeni">{{fiyat}}</span>
    </div>
  </div>
  <div class="cta etiket"><span>{{cta}}</span><span>{{web}}</span></div>
</div></body></html>
