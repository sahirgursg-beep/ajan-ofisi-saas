<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Müşteri kaydı</title>
<style>
  :root { --altin:#C9A24B; --altin2:#E6CC8A; --zemin:#0b0f17; --kart:#181e2c; --cizgi:#2a3145; --acik:#F4EFE6; --soluk:#8a93a8; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--zemin); color:var(--acik); font-family:system-ui,"Segoe UI",sans-serif; font-size:16px; }
  header { padding:18px 18px 10px; } header b { color:var(--altin2); letter-spacing:.12em; font-size:13px; } header h1 { margin:4px 0 0; font-size:22px; }
  main { padding:0 14px 120px; }
  .kutu { background:var(--kart); border:1px solid var(--cizgi); border-radius:16px; padding:14px; margin-bottom:14px; }
  .e { font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--soluk); margin-bottom:8px; }
  .secim { display:flex; flex-wrap:wrap; gap:8px; }
  .secim span { padding:11px 14px; border-radius:24px; background:#222a3c; border:1px solid var(--cizgi); font-size:15px; user-select:none; }
  .secim span.on { background:#3a2a10; border-color:var(--altin); color:var(--altin2); }
  .urunler { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .urunler div { border-radius:12px; overflow:hidden; border:2px solid transparent; background:#222a3c; font-size:11.5px; }
  .urunler div.on { border-color:var(--altin); }
  .urunler img { width:100%; aspect-ratio:4/5; object-fit:cover; display:block; background:#000; }
  .urunler p { margin:0; padding:5px 6px; line-height:1.25; height:3.2em; overflow:hidden; }
  input, textarea { width:100%; background:#0e121b; color:var(--acik); border:1px solid var(--cizgi); border-radius:12px; padding:13px; font-size:16px; font-family:inherit; }
  .sonuclar div { padding:11px 12px; border-bottom:1px solid var(--cizgi); font-size:15px; } .sonuclar div small { color:var(--soluk); display:block; }
  .secili-urun { margin-top:10px; padding:11px 12px; border-radius:12px; background:#2b2416; color:var(--altin2); display:none; }
  button { width:100%; padding:16px; border:0; border-radius:14px; background:var(--altin); color:#1E2433; font-size:17px; font-weight:700; }
  .alt { position:fixed; left:0; right:0; bottom:0; padding:12px 14px 18px; background:linear-gradient(180deg, transparent, var(--zemin) 30%); }
  #mesaj { text-align:center; padding:8px; font-size:14px; min-height:20px; }
  #pinEkran { padding:40px 18px; } #pinEkran input { text-align:center; font-size:28px; letter-spacing:.4em; margin:16px 0; }
</style>
<script src="/musteri.js"></script>
<script src="/dil.js"></script>
</head>
<body>
<header><b id="markaAd"></b><h1>Sosyal medyadan müşteri</h1></header>
<div id="pinEkran">
  <div class="kutu"><div class="e">Ofis PIN'i</div>
    <div style="font-size:14px;color:var(--soluk)">PIN ofis ekranında Performans → Satış bölümünde yazar.</div>
    <input id="pin" inputmode="numeric" maxlength="6" autocomplete="off">
    <button onclick="girisYap()">Giriş</button><div id="pinMesaj" style="text-align:center;margin-top:10px;color:#f08080"></div></div>
</div>
<main id="form" style="display:none">
  <div class="kutu"><div class="e">Müşteri nereden geldi?</div><div class="secim" id="kaynak"></div></div>
  <div class="kutu"><div class="e">Hangi ürün? (son paylaşılanlar)</div><div class="urunler" id="urunler"></div>
    <div style="margin-top:12px"><input id="ara" placeholder="ya da ürün ara: soho, dining…" oninput="aramaYap()"></div>
    <div class="sonuclar" id="sonuclar"></div><div class="secili-urun" id="seciliUrun"></div></div>
  <div class="kutu"><div class="e">Durum</div><div class="secim" id="durum"></div>
    <div style="margin-top:12px"><input id="tutar" inputmode="numeric" placeholder="Satış tutarı (isteğe bağlı)"></div></div>
  <div class="kutu"><div class="e">Satıcı ve not</div><div class="secim" id="saticilar" style="margin-bottom:10px"></div>
    <input id="satici" placeholder="Adın"><div style="height:10px"></div><textarea id="not" rows="2" placeholder="Not (isteğe bağlı)"></textarea></div>
  <div class="alt"><div id="mesaj"></div><button onclick="gonder()">Kaydet</button></div>
</main>
<script>
const $ = s => document.getElementById(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let PIN = localStorage.getItem("frPin") || "", SEC = {kaynak:"instagram", durum:"soru", urun:null};
function secimCiz(id, sozluk, alan) {
  $(id).innerHTML = Object.entries(sozluk).map(([k, ad]) => `<span data-k="${k}" class="${SEC[alan] === k ? "on" : ""}">${esc(ad)}</span>`).join("");
  $(id).querySelectorAll("span").forEach(s => s.onclick = () => { SEC[alan] = s.dataset.k; secimCiz(id, sozluk, alan); $("tutar").style.display = SEC.durum === "satildi" ? "" : "none"; });
}
function urunSec(u) { SEC.urun = u; $("seciliUrun").style.display = "block"; $("seciliUrun").textContent = "✓ " + u.ad;
  document.querySelectorAll("#urunler div").forEach(d => d.classList.toggle("on", d.dataset.url === u.url)); }
async function girisYap() {
  PIN = $("pin").value.trim() || PIN;
  const r = await fetch("/api/liste?pin=" + encodeURIComponent(PIN));
  if (r.status === 403) { $("pinMesaj").textContent = "PIN hatalı"; $("pinEkran").style.display = "block"; $("form").style.display = "none"; return; }
  const v = await r.json(); localStorage.setItem("frPin", PIN);
  $("pinEkran").style.display = "none"; $("form").style.display = "block";
  secimCiz("kaynak", v.kaynaklar, "kaynak"); secimCiz("durum", v.durumlar, "durum"); $("tutar").style.display = "none";
  window._son = v.son;
  $("urunler").innerHTML = v.son.map((u, i) => `<div data-url="${esc(u.url)}" onclick="urunSec(window._son[${i}])"><img src="${esc(u.gorsel)}?pin=${encodeURIComponent(PIN)}" loading="lazy"><p>${esc(u.ad)}</p></div>`).join("")
    || '<div style="grid-column:1/-1;color:var(--soluk);font-size:14px;padding:8px">Henüz paylaşılan ürün yok, aşağıdan ara.</div>';
  $("saticilar").innerHTML = (v.saticilar || []).map(s => `<span>${esc(s)}</span>`).join("");
  $("saticilar").querySelectorAll("span").forEach(s => s.onclick = () => { $("satici").value = s.textContent; });
  $("satici").value = localStorage.getItem("frSatici") || "";
}
let _t;
function aramaYap() { clearTimeout(_t); _t = setTimeout(async () => {
  const q = $("ara").value.trim(); if (q.length < 2) { $("sonuclar").innerHTML = ""; return; }
  const v = await (await fetch(`/api/ara?pin=${encodeURIComponent(PIN)}&q=${encodeURIComponent(q)}`)).json(); window._ara = v;
  $("sonuclar").innerHTML = v.map((u, i) => `<div onclick="urunSec(window._ara[${i}]);$('sonuclar').innerHTML=''">${esc(u.ad)}<small>${esc(u.kategori)}</small></div>`).join("")
    || '<div style="color:var(--soluk)">Bulunamadı — yazdığın ad olduğu gibi kaydedilir.</div>'; }, 250); }
async function gonder() {
  const urun = SEC.urun || ($("ara").value.trim() ? {ad: $("ara").value.trim(), url: ""} : null);
  if (!urun) { $("mesaj").textContent = "Bir ürün seç ya da yaz"; return; }
  localStorage.setItem("frSatici", $("satici").value.trim());
  const r = await (await fetch("/api/kaydet", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({
    pin:PIN, kaynak:SEC.kaynak, durum:SEC.durum, urun:urun.ad, urun_url:urun.url, kategori:urun.kategori || "",
    tutar:$("tutar").value, satici:$("satici").value, not:$("not").value})})).json();
  if (r.hata) { $("mesaj").textContent = "✖ " + r.hata; return; }
  $("mesaj").textContent = "✓ Kaydedildi" + (r.baglandi ? " · paylaşıma bağlandı" : "") + ". Teşekkürler!";
  SEC.urun = null; $("seciliUrun").style.display = "none"; $("ara").value = ""; $("not").value = ""; $("tutar").value = "";
  document.querySelectorAll("#urunler div").forEach(d => d.classList.remove("on"));
  window.scrollTo({top:0, behavior:"smooth"});
}
if (PIN) girisYap();
</script>
<script>document.getElementById("markaAd").textContent = (window.MUSTERI || {}).marka || "";
if (window.MUSTERI) document.getElementById("tutar").placeholder += " " + MUSTERI.para;</script>
</body>
</html>
